          type: integer
    HostConfigurationResponse:
      type: object
      required:
        - host
        - observation
        - selinux
        - reference
        - selection
        - reference_options
        - comparison
        - view
      properties:
        selection:
          $ref: "#/components/schemas/CatalogReferenceSelection"
        reference_options:
          type: object
          required: [revisions, truncated]
          properties:
            revisions:
              type: array
              maxItems: 50
              description: Active identities only; host distribution/architecture/policy-type relevance first, never an equivalence claim. No family inventories or import bytes.
              items:
                $ref: "#/components/schemas/CatalogReferenceIdentity"
            truncated:
              type: boolean
        host:
          type: object
          required: [id, hostname, external_id]
          properties:
            id:
              type: integer
            hostname:
              type:
                - string
                - "null"
            external_id:
              type: string
        observation:
          description: Heartbeat-confirmed observation, or null when none exists.
          type:
            - object
            - "null"
          required: [status, last_observed_at, last_received_at]
          properties:
            status:
              type: string
              enum: [current, stale]
            last_observed_at:
              type: string
              format: date-time
            last_received_at:
              type: string
              format: date-time
        selinux:
          type: object
          required: [enforcement, boolean_status, policy_identity]
          properties:
            effective_permissive_domains:
              $ref: "#/components/schemas/EffectivePermissiveDomains"
            enforcement:
              type:
                - string
                - "null"
            configured_policy_type:
              type:
                - string
                - "null"
            boolean_status:
              type:
                - string
                - "null"
            port_inventory_status:
              type: string
              enum: [observed, partial, unavailable, unknown]
              description: Effective port inventory trust, independent of aggregate checkpoint age and unrelated inventory families.
            file_context_mappings_status:
              type: string
              enum: [observed, partial, unavailable, unknown]
              description: Expected-label configuration completeness/trust, separate from actual object labels.
            policy_identity:
              type:
                - string
                - "null"
        reference:
          type: object
          required:
            - kind
          properties:
            kind:
              type: string
              enum: [distribution_catalog, none]
            catalog_revision:
              type:
                - object
                - "null"
              required: [id, display_name, policy_type, architecture, loaded_policy_digest, content_digest, lifecycle, applicability]
              properties:
                id:
                  type: integer
                display_name:
                  type: string
                policy_type:
                  type:
                    - string
                    - "null"
                architecture:
                  type:
                    - string
                    - "null"
                loaded_policy_digest:
                  type:
                    - string
                    - "null"
                content_digest:
                  type: string
                lifecycle:
                  type: string
                  enum: [active, archived]
                applicability:
                  description: 'exact for automatic loaded-policy identity, major_release for Boolean/port-only agreement, explicit for an operator target without equivalence assertion.'
                  type: string
                  enum: [exact, major_release, explicit]
        comparison:
          type: object
          required:
            - available
            - paused
            - summary
            - effective_permissive_domains
          properties:
            effective_permissive_domains:
              $ref: "#/components/schemas/EffectivePermissiveComparison"
            deviations:
              $ref: "#/components/schemas/HostConfigurationDeviations"
            available:
              type: boolean
              description: Reference overlays can be displayed under the existing trusted identity gate; individual comparison usability is in selection.families, and stale results are paused.
            paused:
              description: True when the observation is stale and comparison is paused.
              type: boolean
            summary:
              type: object
              required: [booleans, ports]
              properties:
                booleans:
                  $ref: "#/components/schemas/HostConfigurationBooleanSummary"
                ports:
                  $ref: "#/components/schemas/HostConfigurationPortSummary"
        view:
          type: string
          enum: [differences, booleans, ports, effective_permissive_domains]
        entries:
          description: Paginated, filtered baseline deviations for view=differences, or membership for effective_permissive_domains. Known mismatches and set differences precede unobserved entries, in stable family/name order. Deviation results distinguish value mismatches, host-only settings, reference-only domain membership, and unobserved reference entries (including port mappings). entries.total counts filtered rows; comparison.deviations contains unfiltered deviation totals. Unknown membership is never treated as an empty set. Legacy differences and comparison set fields retain their complete scope and confirmed-difference semantics.
          $ref: "#/components/schemas/HostConfigurationEntryPage"
        differences:
          description: Present when `view` is `differences`.
          $ref: "#/components/schemas/HostConfigurationDifferences"
        booleans:
          description: Present when `view` is `booleans`.
          $ref: "#/components/schemas/HostConfigurationBooleanPage"
        ports:
          description: Present when `view` is `ports`.
          $ref: "#/components/schemas/HostConfigurationPortPage"
    CatalogReferenceIdentity:
      type: object
      required: [id, display_name, content_digest, loaded_policy_digest, lifecycle, distribution, major_version, architecture, policy_type]
      properties:
        id:
          type: integer
        display_name:
          type: string
          description: Presentation only; duplicate names are allowed.
        content_digest:
          type: string
        loaded_policy_digest:
          type: string
        lifecycle:
          type: string
          enum: [active, archived]
        distribution:
          type: string
        major_version:
          type: string
        architecture:
          type: string
        policy_type:
          type: string
    CatalogFamilyApplicability:
      type: object
      required: [status, reference_status, host_status, comparison_allowed, reason]
      properties:
        status:
          type: string
          enum: [comparable, incomplete, unavailable, unknown, stale, unsupported]
        reference_status:
          type: string
          enum: [complete, incomplete, unavailable, unsupported, observed, pending, error, not_evaluated]
        host_status:
          type: string
        comparison_allowed:
          type: boolean
          description: Partial host data permits only observed comparisons, not missing-state claims.
        reason:
          type: [string, "null"]
    CatalogReferenceSelection:
      type: object
      required: [mode, status, basis, reason, selected_revision, candidates, candidate_count, candidates_truncated, context, policy_identity_match, equivalence_asserted, families]
      description: |
        One domain selection contract. Selected revision is separate from family
        usability. Automatic exact/family-agreement and explicit request basis never fill
        missing host evidence. Effective permissive membership under family agreement
        requires complete V4 inline facts with compatible extraction semantics and
        unanimous candidate sets. Fresh evaluation uses current active eligibility;
        there is no persisted historical selection pin.
      properties:
        mode:
          type: string
          enum: [automatic, explicit]
        status:
          type: string
          enum: [selected, absent, ambiguous, unavailable]
        basis:
          type: [string, "null"]
          enum: [exact_policy_identity, major_release_family_agreement, explicit_revision, null]
        reason:
          type: [string, "null"]
        selected_revision:
          oneOf:
            - $ref: "#/components/schemas/CatalogReferenceIdentity"
            - type: "null"
        candidates:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/CatalogReferenceIdentity"
        candidate_count:
          type: integer
        candidates_truncated:
          type: boolean
        context:
          type: object
          required: [distribution, major_version, architecture, policy_type]
          properties:
            distribution:
              type: string
            major_version:
              type: string
            architecture:
              type: string
            policy_type:
              type: string
        policy_identity_match:
          type: [boolean, "null"]
          description: Trusted host/reference raw SHA equality only; explicit selection does not assert equivalence regardless of equality.
        equivalence_asserted:
          type: boolean
          description: True only for automatic exact raw-policy identity, not a statement that all reference families are available.
        families:
          type: object
          required: [booleans, ports, effective_permissive_domains]
          description: Automatic major-release selection permits effective permissive comparison only when every eligible V4 catalog has complete facts under compatible extractor semantics and all candidate sets agree; otherwise this family is Unknown. Exact and compatible explicit selection remain supported.
          properties:
            booleans:
              $ref: "#/components/schemas/CatalogFamilyApplicability"
            ports:
              $ref: "#/components/schemas/CatalogFamilyApplicability"
            effective_permissive_domains:
              $ref: "#/components/schemas/CatalogFamilyApplicability"
    EffectivePermissiveEvidence:
      type: object
      required: [status, policy_identity, semantics_version, evaluator_version, evaluated_at]
      properties:
        provenance:
          type: [string, "null"]
          enum: [exact_loaded_policy_artifact, inline_catalog_extraction, null]
          description: Reference inline facts are collector-reported, not server-verified binary extraction.
        status:
          type: string
          enum: [observed, pending, unavailable, error]
        policy_identity:
          type: [string, "null"]
        semantics_version:
          type: [integer, "null"]
        evaluator_version:
          type: [string, "null"]
        evaluated_at:
          type: [string, "null"]
          format: date-time
        snapshot_id:
          type: [integer, "null"]
        observation_id:
          type: [integer, "null"]
        evidence_basis:
          type: [string, "null"]
          enum: [trusted_current_checkpoint, null]
        revision_id:
          type: integer
        content_digest:
          type: string
    EffectivePermissiveComparison:
      type: object
      description: Complete host exact-policy and collector-reported catalog membership sets. Automatic major-release applicability requires complete, compatible, unanimous candidate facts. Differences are state evidence, not administrative attribution, security judgment or binary equivalence. Unknown never supplies partial differences.
      required: [status, reason, host, reference, selection, matching, unexpected_on_host, missing_from_host, counts]
      properties:
        status:
          type: string
          enum: [observed, unknown]
        reason:
          type: [string, "null"]
          enum: [host_policy_identity_unavailable, stale_host_observation, host_policy_artifact_unavailable, host_permissive_analysis_pending, host_permissive_analysis_unavailable, host_permissive_analysis_error, reference_absent, reference_ambiguous, reference_unavailable, reference_archived, incompatible_policy_context, reference_inline_facts_unavailable, reference_extraction_semantics_incompatible, effective_permissive_reference_ambiguous, null]
        host:
          $ref: "#/components/schemas/EffectivePermissiveEvidence"
        reference:
          oneOf:
            - $ref: "#/components/schemas/EffectivePermissiveEvidence"
            - type: "null"
        selection:
          type: object
          required: [mode, basis, policy_identity_match, equivalence_asserted]
          properties:
            mode:
              type: string
              enum: [automatic, explicit]
            basis:
              type: [string, "null"]
              enum: [exact_policy_identity, major_release_family_agreement, explicit_revision, null]
            policy_identity_match:
              type: [boolean, "null"]
            equivalence_asserted:
              type: boolean
        matching:
          type: [array, "null"]
          items:
            type: string
        unexpected_on_host:
          type: [array, "null"]
          items:
            type: string
        missing_from_host:
          type: [array, "null"]
          items:
            type: string
        counts:
          type: [object, "null"]
          required: [matching, unexpected_on_host, missing_from_host]
          properties:
            matching:
              type: integer
              minimum: 0
            unexpected_on_host:
              type: integer
              minimum: 0
            missing_from_host:
              type: integer
              minimum: 0
    CatalogImport:
      type: object
      required:
        - id
        - acquisition_metadata
        - imported_at
      properties:
        id:
          type: integer
        source_path:
          type: [string, "null"]
        source_kind:
          type: string
          enum: [unspecified, administrative_cli, operator_upload]
        imported_by:
          type: [string, "null"]
        comparison_report:
          oneOf:
            - $ref: "#/components/schemas/CatalogImportComparison"
            - type: "null"
          description: Immutable post-import report recorded with this evidence; null for older imports without a report. Not a vendor upgrade/security-impact claim.
        acquisition_metadata:
          type: object
          additionalProperties: true
        imported_at:
          type: string
          format: date-time
    CatalogImportComparison:
      type: object
      required: [status, reason, basis, direction, from_revision, to_revision, candidate_count, candidates, candidates_truncated, changes]
      description: |
        Post-import only, atomically recorded. Unique existing complete same
        distribution/major-release/architecture-alias/policy-type/schema/semantics
        revision is the basis, including archived records. Multiple identities
        are ambiguous even if family facts agree. Import time/package versions
        never choose a predecessor. No review/support status is inferred.
      properties:
        status:
          type: string
          enum: [compared, none, ambiguous, unavailable, not_applicable]
        reason:
          type: [string, "null"]
        basis:
          type: string
          const: unique_existing_same_context_revision
        direction:
          type: string
          const: existing_to_imported
        from_revision:
          oneOf:
            - $ref: "#/components/schemas/CatalogComparisonIdentity"
            - type: "null"
        to_revision:
          $ref: "#/components/schemas/CatalogComparisonIdentity"
        candidate_count:
          type: integer
        candidates:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/CatalogComparisonIdentity"
        candidates_truncated:
          type: boolean
        changes:
          oneOf:
            - $ref: "#/components/schemas/CatalogComparisonChanges"
            - type: "null"
    CatalogComparisonIdentity:
      type: object
      required: [id, content_digest, loaded_policy_digest, distribution, major_version, architecture, policy_type]
      properties:
        id:
          type: integer
        content_digest:
          type: string
        loaded_policy_digest:
          type: string
        distribution:
          type: string
        major_version:
          type: string
        architecture:
          type: string
        policy_type:
          type: string
    CatalogComparisonChange:
      type: object
      required: [count, samples, truncated]
      properties:
        count:
          type: integer
        samples:
          type: array
          maxItems: 10
          items: {}
        truncated:
          type: boolean
    CatalogComparisonChanges:
      type: object
      required: [policy, booleans, ports]
      properties:
        policy:
          type: object
          required: [loaded_policy_digest_changed, packages_changed]
          properties:
            loaded_policy_digest_changed:
              type: boolean
            packages_changed:
              type: boolean
        booleans:
          type: object
          required: [added, removed, default_changed, description_changed]
          properties:
            added:
              $ref: "#/components/schemas/CatalogComparisonChange"
            removed:
              $ref: "#/components/schemas/CatalogComparisonChange"
            default_changed:
              $ref: "#/components/schemas/CatalogComparisonChange"
            description_changed:
              $ref: "#/components/schemas/CatalogComparisonChange"
        ports:
          type: object
          required: [added, removed, changed]
          properties:
            added:
              $ref: "#/components/schemas/CatalogComparisonChange"
            removed:
              $ref: "#/components/schemas/CatalogComparisonChange"
            changed:
              $ref: "#/components/schemas/CatalogComparisonChange"
    Catalog:
      type: object
      required:
        - id
        - display_name
        - lifecycle
        - distribution
        - major_version
        - architecture
        - policy_type
        - kernel_policy_version
        - schema_version
        - collector_semantics_version
        - content_digest
        - loaded_policy_digest
        - booleans_complete
        - ports_complete
        - booleans_count
        - port_mappings_count
        - created_at
      properties:
        id:
          type: integer
        display_name:
          type: string
          description: Mutable operator label, initially derived from distribution/major version. Not a unique identity or vendor-origin claim.
        lifecycle:
          type: string
          enum: [active, archived]
          description: Administrative eligibility for new automatic selection, not content validity or review status.
        distribution:
          type: string
          example: almalinux
        major_version:
          type: string
          example: "9"
        architecture:
          type: string
          example: x86_64
        policy_type:
          type: string
          example: targeted
        kernel_policy_version:
          type: integer
        schema_version:
          type: integer
          description: Catalog artifact format/schema version.
        collector_semantics_version:
          type: integer
          description: Collector semantics version the catalog was produced with.
        content_digest:
          type: string
          description: Immutable digest of the catalog content.
        loaded_policy_digest:
          type: string
          description: Immutable digest of the loaded policy the catalog was derived from.
        booleans_complete:
          type: boolean
        ports_complete:
          type: boolean
        booleans_count:
          type: integer
        port_mappings_count:
          type: integer
        created_at:
          type: string
          format: date-time
    CatalogDetail:
      allOf:
        - $ref: "#/components/schemas/Catalog"
        - type: object
          required:
            - policy_packages
            - imports
            - booleans
            - port_mappings
            - effective_permissive_domains
          properties:
            effective_permissive_domains:
              $ref: "#/components/schemas/CatalogPermissiveDomains"
            policy_packages:
              type: array
              items:
                type: object
                additionalProperties: true
            imports:
              type: array
              items:
                $ref: "#/components/schemas/CatalogImport"
            booleans:
              type: array
              items:
                type: object
                required:
                  - name
                  - default_value
                  - description
                properties:
                  name:
                    type: string
                  default_value:
                    type: boolean
                  description:
                    type: string
            port_mappings:
              type: array
              items:
                type: object
                required:
                  - protocol
                  - start
                  - end
                  - type
                properties:
                  protocol:
                    type: string
                  start:
                    type: integer
                  end:
                    type: integer
                  type:
                    type: string
                    description: SELinux port type.
    CatalogPermissiveDomains:
      type: object
      description: Collector-reported inline reference membership bound to catalog content and declared policy SHA, not server-verified binary extraction. Unavailable facts never imply an empty set.
      required: [status, domains, policy_identity, provenance, catalog_revision_id, content_digest, semantics_version, evaluator_version]
      properties:
        status: {type: string, enum: [observed, unavailable]}
        domains: {type: [array, 'null'], items: {type: string}}
        policy_identity: {type: string}
        provenance: {type: string, const: inline_catalog_extraction}
        catalog_revision_id: {type: integer}
        content_digest: {type: string}
        semantics_version: {type: [integer, 'null']}
        evaluator_version: {type: [string, 'null']}
        reason: {type: [string, 'null']}
    CatalogListResponse:
      type: object
      required:
        - catalogs
      properties:
        catalogs:
          type: array
          items:
            $ref: "#/components/schemas/Catalog"
    CatalogDetailResponse:
