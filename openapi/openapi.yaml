        affected_host_count:
          type: integer
          minimum: 0
        host_status_counts:
          type: object
          additionalProperties: true
        explanation_groups:
          type: array
          items:
            type: object
            additionalProperties: true
        disagreeing_hosts:
          type: array
          items:
            type: object
            additionalProperties: true
        insufficient_evidence_hosts:
          type: array
          items:
            type: object
            additionalProperties: true
    Hypothesis:
      type: object
      required:
        - kind
        - label
        - confidence_band
