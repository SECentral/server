                  $ref: "#/components/schemas/HostSelinux"
    EnforcingReadiness:
      type: object
      description: Server-calculated accumulated reporting progress toward a 30-day target. Numeric progress can coexist with unknown capture continuity. Unknown carries null duration/band, never older certainty.
      required: [status, reason, band, target_days, credited_seconds, reporting_days, capture_continuity, reporting_started_at, latest_avc_at, explanation]
      properties:
        status:
          type: string
          enum: [observed, unknown]
        reason:
          type: [string, 'null']
          enum: [reporting_not_tracked, reporting_time_unknown, enforcement_unavailable, reporting_stale, checkpoint_unavailable, checkpoint_boot_mismatch, denial_time_unavailable, null]
        band:
          type: [string, 'null']
          enum: ['0–19%', '20–39%', '40–59%', '60–79%', '80–99%', '100%', null]
        target_days:
          type: integer
          enum: [30]
        credited_seconds:
          type: [number, 'null']
          minimum: 0
        reporting_days:
          description: Credited days rounded down to one decimal; null for Unknown. The explanation handles nonzero durations below 0.1 day.
          type: [number, 'null']
          minimum: 0
        capture_continuity:
          type: string
          enum: [unknown]
        reporting_started_at:
          type: [string, 'null']
          format: date-time
        latest_avc_at:
          type: [string, 'null']
          format: date-time
        explanation:
          description: Authoritative plain-text tooltip with blank-line paragraph boundaries. Numeric results summarize observation progress with a separate safety caveat; Unknown results explain the reason. Render as text.
          type: string
