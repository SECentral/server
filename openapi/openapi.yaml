      properties:
        kind:
          type: string
        label:
          type: string
        confidence_band:
          type: string
        evidence_status:
          type: string
        supporting_evidence:
          type: array
          items:
            type: object
            additionalProperties: true
        why:
          type: string
        does_not_prove:
          type: string
        missing_evidence:
          type: array
          items:
            type: string
        confirmation:
          type: string
        temporal_scope:
          type: string
    SelinuxCheckpoint:
      type: object
      required: [id, host_id, boot_id, event_time, evidence_class, policy_identity, enforcement, booleans]
      properties:
        id: { type: integer }
        host_id: { type: integer }
        boot_id: { type: string }
        event_time: { type: string, format: date-time }
        evidence_class: { type: string, enum: [observed_checkpoint] }
        policy_identity: { type: [string, "null"] }
        enforcement: { type: [string, "null"] }
        booleans:
          type: array
          description: Only names relevant to linked change records. Values come from this checkpoint; absent or unobserved current state is null, never copied from a transition delta.
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: [boolean, "null"] }
    SelinuxLogHost:
      type: object
      required: [id, hostname, external_id]
      properties:
        id: { type: integer }
        hostname: { type: [string, "null"] }
        external_id: { type: string }
    SelinuxAdministrativeFacts:
      type: object
      required: [transition_type, boundary_established, boolean_changes, enforcement_changes, port_changes, file_context_changes]
      properties:
        transition_type:
          $ref: "#/components/schemas/SelinuxActivityItem/properties/transition_type"
        boundary_established: { type: boolean }
        boolean_changes:
          $ref: "#/components/schemas/SelinuxActivityItem/properties/boolean_changes"
        enforcement_changes:
          $ref: "#/components/schemas/SelinuxActivityItem/properties/enforcement_changes"
        port_changes:
          $ref: "#/components/schemas/SelinuxActivityItem/properties/port_changes"
        file_context_changes:
          $ref: "#/components/schemas/SelinuxActivityItem/properties/file_context_changes"
    SelinuxLogItem:
      type: object
      required: [id, category, event_time, host]
      properties:
        id: { type: integer }
        category: { type: string, enum: [avc, administrative] }
        event_time: { type: string, format: date-time }
        host:
          $ref: "#/components/schemas/SelinuxLogHost"
        issue_id: { type: [integer, "null"] }
        actor:
          $ref: "#/components/schemas/SelinuxActivityActor"
        administrative:
          $ref: "#/components/schemas/SelinuxAdministrativeFacts"
        avc:
          type: object
          required: [status, source_type, target_type, target_class, permissions, target_paths, command, executable, permissive]
          properties:
            status: { type: string }
            source_type: { type: [string, "null"] }
            target_type: { type: [string, "null"] }
            target_class: { type: [string, "null"] }
            permissions: { type: array, items: { type: string } }
            target_paths: { type: array, items: { type: string } }
            command: { type: [string, "null"] }
            executable: { type: [string, "null"] }
            permissive: { type: [boolean, "null"] }
    SelinuxLogResponse:
      type: object
      required: [items, coverage, meta]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SelinuxLogItem"
        coverage: { type: string }
        meta:
          type: object
          required: [page_size, next_cursor]
          properties:
            page_size: { type: integer, minimum: 1, maximum: 100 }
            next_cursor: { type: [string, "null"] }
            page: { type: integer, minimum: 1 }
            total: { type: integer, minimum: 0, description: Exact count of entries matching host/category/time filters in numbered-page mode. }
            total_pages: { type: integer, minimum: 0 }
    SelinuxActivityItem:
      type: object
      required: [id, host_id, boot_id, event_time, evidence_class, transition_type, boundary_established, audit_sequence, boolean_changes, previous_checkpoint, reconciliation, window_avc_count]
      properties:
        actor:
          $ref: "#/components/schemas/SelinuxActivityActor"
        id: { type: integer }
        host_id: { type: integer }
        boot_id: { type: string }
        event_time: { type: string, format: date-time }
        evidence_class: { type: string, enum: [observed_transition, administrative_history] }
        transition_type: { type: string, enum: [policy_load, boolean_change, enforcement_change, port_change, file_context_change] }
        boundary_established: { type: boolean }
        audit_sequence: { type: integer }
        boolean_changes:
          type: array
          items:
            type: object
            required: [name, old_value, new_value, state_change_established]
            properties:
              name: { type: string }
              old_value: { type: boolean }
              new_value: { type: boolean }
              state_change_established: { type: boolean }
        enforcement_changes:
          type: array
          description: Validated enabled-SELinux runtime enforcement fields; an unvalidated MAC_STATUS shape remains history without a delta or boundary.
          items:
            type: object
            required: [old_mode, new_mode, state_change_established]
            properties:
              old_mode: { type: string, enum: [enforcing, permissive] }
              new_mode: { type: string, enum: [enforcing, permissive] }
              state_change_established: { type: boolean }
        port_changes:
          type: array
          description: Validated port-write fields only. Delete omits type; modify has no old value and may be equal-value. Boundary does not claim a reconstructed mapping delta.
          items:
            type: object
            required: [operation, protocol, start, end, target_context, selinux_type, success, boundary_established]
            properties:
              operation: { type: string, enum: [add, modify, delete] }
              protocol: { type: string, enum: [tcp, udp] }
              start: { type: integer, minimum: 1, maximum: 65535 }
              end: { type: integer, minimum: 1, maximum: 65535 }
              target_context: { type: [string, "null"] }
              selinux_type: { type: [string, "null"] }
              success: { type: boolean }
              boundary_established: { type: boolean }
        file_context_changes:
          type: array
          description: Validated expected-label configuration writes; no old context or resulting inode label inferred.
          items:
            type: object
            required: [operation, expression, file_selector, target_context, selinux_type, success, boundary_established, state_change_established]
            properties:
              operation: { type: string, enum: [add, modify, delete] }
              expression: { type: string }
              file_selector: { type: string, enum: [any, file] }
              target_context: { type: [string, "null"] }
              selinux_type: { type: [string, "null"] }
              success: { type: boolean }
              boundary_established: { type: boolean }
              state_change_established: { type: boolean, const: false }
        previous_checkpoint:
          description: Earlier historical checkpoint, not an assertion that it was current throughout the intervening period.
          oneOf:
            - $ref: "#/components/schemas/SelinuxCheckpoint"
            - type: "null"
        reconciliation:
          type: object
          required: [status, checkpoint, next_transition]
          properties:
            status: { type: string, enum: [pending, reconciled, superseded, not_applicable] }
            unreconciled_fields:
              type: array
              items: { type: string, enum: [policy_identity, booleans, enforcement, ports, file_context_mappings] }
              description: Affected dimensions lacking authoritative evidence in the projected checkpoint. A later incomplete observation does not establish reconciliation.
            checkpoint:
              description: Earliest retained checkpoint authoritatively observing all affected dimensions, or the earliest later incomplete observation if no such checkpoint exists. A superseding transition may precede it; unknown fields are not inferred.
              oneOf:
                - $ref: "#/components/schemas/SelinuxCheckpoint"
                - type: "null"
            next_transition:
              oneOf:
                - type: object
                  required: [id, event_time, audit_sequence]
                  properties:
                    id: { type: integer }
                    event_time: { type: string, format: date-time }
                    audit_sequence: { type: integer }
                - type: "null"
        window_avc_count:
          type: integer
          minimum: 0
          description: Retained occurrences with unsafe affected checkpoint dimensions after this boundary, before an overlapping boundary, and at/before the earliest retained checkpoint. Different dimension intervals may overlap; counts are not additive.
    SelinuxActivityResponse:
      type: object
      required: [items, coverage, meta]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SelinuxActivityItem"
        coverage: { type: string }
        meta:
          type: object
          required: [page_size, next_cursor]
          properties:
            page_size: { type: integer, minimum: 1, maximum: 50 }
            next_cursor: { type: [string, "null"] }
            page: { type: integer, minimum: 1 }
            total_pages: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0, description: Total retained supported administrative events for this host, independent of selection or cursor. }
    SelinuxActivityActor:
      type: object
      required: [login_uid, session, executable, command, proctitle]
      description: Observed actor fields; unset or conflicting audit values are null. Included in list summaries without returning raw record payloads.
      properties:
        login_uid: { type: [integer, "null"] }
        execution_uid: { type: [integer, "null"] }
        pid: { type: [integer, "null"] }
        context: { type: [string, "null"] }
        session: { type: [integer, "null"] }
        executable: { type: [string, "null"] }
        command: { type: [string, "null"] }
        proctitle: { type: [string, "null"] }
    SelinuxActivityDetail:
      allOf:
        - $ref: "#/components/schemas/SelinuxActivityItem"
        - type: object
          required: [actor, evidence, window_occurrences]
          properties:
            permissive_domain_comparison:
              oneOf:
                - $ref: "#/components/schemas/PermissivePolicyComparison"
                - type: "null"
            actor:
              $ref: "#/components/schemas/SelinuxActivityActor"
            evidence:
              type: object
              required: [completion_reason, digest, records]
              properties:
                completion_reason: { type: string }
                digest: { type: string }
                records:
                  type: array
                  items:
                    $ref: "#/components/schemas/RawAuditRecordDetail"
            window_occurrences:
              type: array
              maxItems: 20
              items:
                type: object
                required: [id, issue_id, event_time]
                properties:
                  id: { type: integer }
                  issue_id: { type: [integer, "null"] }
                  event_time: { type: string, format: date-time }
    SelinuxActivityDetailResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/SelinuxActivityDetail"
    IssueAnalysisResponse:
      type: object
      required:
        - host_explanations
        - fleet_explanation
        - hypotheses
        - supporting_evidence
      properties:
        host_explanations:
          type: array
          items:
            $ref: "#/components/schemas/HostExplanation"
        fleet_explanation:
          $ref: "#/components/schemas/FleetExplanation"
        hypotheses:
          type: array
          items:
            $ref: "#/components/schemas/Hypothesis"
        supporting_evidence:
          type: object
          required:
            - explanation
            - file_contexts
          properties:
            explanation:
              description: Issue-level policy explanation, or null.
              oneOf:
                - type: object
                  additionalProperties: true
                - type: "null"
            file_contexts:
              type: object
              additionalProperties: true
