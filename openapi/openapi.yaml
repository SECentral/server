                description: Distinct supporting expected-context observation events, not one lookup per covered occurrence.
                type: integer
              reused_observation_occurrences:
                description: Covered denials using another event's eligible observation within the same host, boot, checkpoint and denial tuple.
                type: integer
        additional_finding_count:
          description: Additional finding signatures available through host/occurrence evidence.
          type: integer
        finding_coverage:
          description: Occurrence counts by supported finding kind; counts can overlap. Unexplained means no supported finding, not all questions answered. A primary example is not whole-issue coverage.
          type: object
          additionalProperties:
            type: integer
        issue:
          $ref: "#/components/schemas/Issue"
        intelligence:
          $ref: "#/components/schemas/IssueIntelligenceSummary"
        diagnosis:
          description: Primary diagnosis across the issue, or null when no evidence-backed diagnosis exists.
          oneOf:
            - $ref: "#/components/schemas/Diagnosis"
            - type: "null"
        triage_guidance:
          description: Standard file-label troubleshooting guidance inferred from retained absolute path and AVC label evidence; commands are for operator review only.
          oneOf:
            - $ref: "#/components/schemas/TriageGuidance"
            - type: "null"
        operator_guidance:
          description: Evidence-scoped read-only checks and manual investigation/verification tasks. Local command output has not been observed by SECentral.
          oneOf:
            - $ref: "#/components/schemas/OperatorGuidance"
            - type: "null"
        host_explanations:
          description: Bounded per-host finding summaries for the issue's primary investigation view.
          type: array
          items:
            $ref: "#/components/schemas/IssueHostExplanationSummary"
        fleet_explanation:
          $ref: "#/components/schemas/IssueFleetSummary"
        policy_analysis:
          description: Compact policy-evaluation availability state for explaining an incomplete finding.
          type: object
          required: [status, limitations]
          properties:
            status:
              type: string
              enum: [evaluated, pending, error, unavailable]
            limitations:
              type: array
              items:
                type: string
        triage:
          $ref: "#/components/schemas/TriageSignals"
        resolutions:
          $ref: "#/components/schemas/ResolutionWorkflow"
    OperatorGuidance:
      type: object
      required: [source, checks, manual_check, possible_fix, verification, verification_limit, restriction]
      properties:
        source:
          type: object
          required: [occurrence_id, host_id, hostname, occurred_at, path, observed_type]
          properties:
            occurrence_id:
              type: integer
            host_id:
              type: integer
            hostname:
              type: [string, "null"]
            occurred_at:
              type: string
              format: date-time
            path:
              type: [string, "null"]
            observed_type:
              type: [string, "null"]
            protocol: {type: string, enum: [tcp, udp]}
            port: {type: [integer, 'null'], minimum: 1, maximum: 65535}
            operation: {type: string, enum: [name_bind, name_connect]}
        checks:
          type: array
          items:
            type: object
            required: [title, command, interpretation]
            properties:
              title:
                type: string
              command:
                type: string
              interpretation:
                type: string
        manual_check:
          type: string
        possible_fix:
          type: string
        verification:
          type: string
        verification_limit:
          type: string
        restriction:
          type: string
    TriageGuidance:
      description: Convention-based investigation lead, not an authoritative finding or reviewed change plan. Eligible contradictory or conflicting expected-context observations suppress the lead; missing or null guidance is valid.
      type: object
      required: [type, title, path, observed_type, summary, commands, path_count, recursive_path_count]
      properties:
        type:
          type: string
          enum: [probable_label_mismatch]
        title:
          type: string
        path:
          type: string
        observed_type:
          type: string
        conventional_type:
          description: Common convention only, never a host-resolved expected context.
          type: [string, "null"]
        path_count:
          description: Number of distinct qualifying paths; the path field is the lexicographically first representative, not whole-issue coverage.
          type: integer
        recursive_directory:
          type: [string, "null"]
        recursive_path_count:
          description: Qualifying distinct retained paths beneath recursive_directory across hosts, not occurrence coverage or a guarantee of resolution.
          type: integer
        summary:
          type: string
        commands:
          type: array
          items:
            type: object
            required: [action, label, command]
            properties:
              action:
                type: string
                enum: [inspect, restore_targeted, restore_recursive]
              label:
                type: string
              command:
                type: string
    IssueHostExplanationSummary:
      type: object
      required: [host_id, status, occurrence_count, unexplained_occurrence_count, diagnosis_groups, additional_diagnosis_group_count]
      properties:
        host_id:
          type: integer
        hostname:
          type: [string, "null"]
        status:
