            properties:
              status:
                type: string
                enum: [diagnosed, insufficient_evidence]
              count:
                type: integer
              diagnosis:
                oneOf:
                  - $ref: "#/components/schemas/Diagnosis"
                  - type: "null"
              sample_occurrence_ids:
                type: array
                items:
                  type: integer
              policy_identity_count:
                type: integer
              policy_provenance:
                type: array
                items:
                  type: object
                  required: [policy_identity, checkpoint_observed_at, occurrence_id]
                  properties:
                    policy_identity:
                      type: string
                    checkpoint_observed_at:
                      type: [string, "null"]
                      format: date-time
                    occurrence_id:
                      type: integer
                  additionalProperties: false
              additional_policy_identity_count:
                type: integer
        additional_diagnosis_group_count:
          type: integer
      additionalProperties: false
    IssueFleetSummary:
      type: object
      required: [state, affected_host_count, host_status_counts]
      properties:
        state:
          type: string
          enum: [consistent, disagreement, partially_explained, insufficient_evidence]
        affected_host_count:
          type: integer
        host_status_counts:
          type: object
          additionalProperties:
            type: integer
      additionalProperties: false
    NormalizedDenialDetail:
      type: object
      required:
        - status
        - target_paths
        - details
      properties:
        status:
          type: string
        source_type:
          type: string
        target_type:
          type: string
        target_class:
          type: string
        permissions:
          type: array
          items:
            type: string
        target_paths:
          type: array
          items:
            type: string
        source_context:
          type:
            - string
            - "null"
        target_context:
          type:
            - string
            - "null"
        command:
          type:
            - string
            - "null"
        executable:
          type:
            - string
            - "null"
        details:
          type: object
          additionalProperties: true
    RawAuditRecordDetail:
      type: object
      required:
        - position
        - record_type
        - type_name
        - audit_timestamp
        - sequence
        - payload
      properties:
        position:
          type: integer
        record_type:
          description: Authoritative kernel audit record type code (e.g. 1400 = AVC, 1401 = SELINUX_ERR).
          type: integer
        type_name:
          description: Retained diagnostic type name. Known names must resolve case-insensitively to record_type; original payload text is not normalized.
          type: string
        audit_timestamp:
          type: string
          format: date-time
        sequence:
          type: integer
        payload:
          description: Preserved audit record text. Render as text, never as markup.
          type: string
    RawEventDetail:
      type: object
      required:
        - id
        - audit_timestamp
        - audit_sequence
        - boot_id
        - category
        - transition_type
        - completion_reason
        - evidence_digest
        - audit_records
      properties:
        id:
          type: integer
        audit_timestamp:
          type: string
          format: date-time
        audit_sequence:
          type: integer
        boot_id:
          type: string
        category:
          type: string
          enum: [avc, selinux_administrative]
        transition_type:
          type:
            - string
            - "null"
          enum: [policy_load, boolean_change, enforcement_change, port_change, file_context_change, null]
        checkpoint_enforcement_mode:
          type: string
          enum: [enforcing, permissive, disabled, unknown]
          description: Host mode from the associated checkpoint only when that dimension remains trusted; distinct from AVC-local permissive evidence.
        checkpoint_invalidated_fields:
          type: array
          items: { type: string, enum: [enforcement, ports, policy_identity, booleans, file_context_mappings] }
          description: Scoped checkpoint uncertainty reported by the collector or derived independently from retained transitions.
        checkpoint_port_inventory_status:
          type: string
          enum: [observed, partial, unavailable, unknown]
          description: Trusted checkpoint port inventory coverage; Unknown during a known port boundary. AVC target context is separate direct evidence.
        checkpoint_file_context_mappings_status:
          type: string
          enum: [observed, partial, unavailable, unknown]
          description: Expected-label mapping configuration trust; not actual inode labels or retrospective matchpathcon evidence.
        checkpoint_policy_identity:
          type: [string, "null"]
          description: Exact identity only when the occurrence checkpoint identity dimension is trusted.
        permissive_policy_state:
          $ref: "#/components/schemas/OccurrencePermissivePolicyState"
        completion_reason:
          type: string
        evidence_digest:
          type: string
        file_context_observations:
          type: array
          items:
            type: object
            additionalProperties: true
        audit_records:
          type: array
          items:
            $ref: "#/components/schemas/RawAuditRecordDetail"
    OccurrenceGuidance:
      type: object
      required:
        - summary
        - observations
        - checks
        - missing_evidence
        - historical_limitations
      properties:
        summary:
          type: string
        observations:
          type: array
          items:
            type: object
            additionalProperties: true
        checks:
          type: array
          items:
            type: object
            additionalProperties: true
        missing_evidence:
          type: array
          items:
            type: string
        historical_limitations:
          type: array
          items:
            type: string
    OccurrenceDetail:
      type: object
      required:
